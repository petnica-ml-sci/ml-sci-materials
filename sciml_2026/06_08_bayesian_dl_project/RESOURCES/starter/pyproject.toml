[project]
name = "bdl-project"
version = "0.1.0"
description = "Honest Error Bars: comparing Bayesian deep learning methods (PSIML summer school project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
# Track C (biology / imaging), preferred data source. Without it Track C falls
# back to FashionMNIST-vs-MNIST via torchvision, which is always available.
# Install with:  uv sync --extra med
med = ["medmnist>=3.0"]

# CPU-only torch wheels: keeps `uv sync` small and fast, and makes the core
# assignment run identically for everyone. For the GPU bonus notebook, comment
# out this block (see README).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bdl"]
