name: psi-ml-default
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python==3.9
  - pytorch==2.5.1
  - torchvision==0.20.1
  - pymc>=5
  - arviz
  - statsmodels
  - scikit-learn
  - seaborn
  - graphviz
  - matplotlib
  - pandas
  - numpy
  - jupyterlab
  - ipykernel
  - corner
  - pyro-ppl
  - torchmetrics

# Create the environment with requirements
# conda env create -n psi-ml-default -f env.yaml

# Install the kernel for Jupyter
# python -m ipykernel install --user --name=psi-ml-default --display-name "Python (psi-ml-default)"

# Activate the environment
# conda activate psi-summer-school

# Update the environment when the config file changes
# conda env update -n psi-ml-default -f env.yaml

